name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI passed for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.sha;
            const deadline = Date.now() + 5 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "ci.yml",
                branch: "main",
                event: "push",
                head_sha: headSha,
                per_page: 100,
              });
              const runs = data.workflow_runs;
              const passed = runs.find((run) =>
                run.status === "completed" && run.conclusion === "success"
              );
              if (passed) {
                core.info(`CI passed for ${headSha}: ${passed.html_url}`);
                return;
              }

              const active = runs.some((run) => run.status !== "completed");
              if (runs.length > 0 && !active) {
                const results = runs.map((run) => `${run.id}:${run.conclusion}`).join(", ");
                core.setFailed(`CI did not pass for ${headSha}: ${results}`);
                return;
              }

              core.info(`Waiting for CI on ${headSha}...`);
              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }

            core.setFailed(`Timed out waiting for successful CI on ${headSha}`);

  release:
    needs: verify-ci
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release artifacts
        run: ./build/build-release.sh
        env:
          SUNA_BUILD_VERSION: ${{ github.ref_name }}

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 * > checksums.txt

      - name: Read release notes from tag
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          object_type="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || true)"
          if [ "$object_type" = "tag" ]; then
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          else
            {
              echo "${GITHUB_REF_NAME}"
              echo
              echo "Release notes were not provided. Use an annotated tag to set release notes:"
              echo
              echo "  git tag -a ${GITHUB_REF_NAME}"
            } > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
